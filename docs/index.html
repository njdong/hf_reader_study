<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HF Reader Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Case mode: one whole case per screen (stem, 6-domain table, preferences, safety, comment) */
:root {
  --bg: #f4f6f7; --surface: #ffffff; --fg: #1a2127; --muted: #5a6670; --line: #d9dfe3;
  --accent: #1d5a85; --accent-soft: #e3edf5; --on-accent: #ffffff; --warn: #9a3b2a; --ok: #2f6b45;
  --stem: #eef3f8; --head: #dfe8f3; --lab: #f4f7fa;
  --font-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111518; --surface: #191e22; --fg: #e3e8eb; --muted: #95a1aa; --line: #2a3238;
    --accent: #79afdb; --accent-soft: #1c2934; --on-accent: #0f1a22; --warn: #e08a76; --ok: #7cc496;
    --stem: #1c2329; --head: #22303b; --lab: #1e252b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111518; --surface: #191e22; --fg: #e3e8eb; --muted: #95a1aa; --line: #2a3238;
  --accent: #79afdb; --accent-soft: #1c2934; --on-accent: #0f1a22; --warn: #e08a76; --ok: #7cc496;
  --stem: #1c2329; --head: #22303b; --lab: #1e252b; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
[hidden] { display: none !important; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); }
.help { font-size: 14px; color: var(--muted); text-decoration: underline; }
.bar-in { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; }
.brand { font-weight: 700; font-size: 14.5px; }
.prog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { width: 120px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fill { display: block; height: 100%; width: 0; background: var(--accent); }
.demo { max-width: 1100px; margin: 12px auto 0; padding-inline: 16px; font-size: 13px; color: var(--warn); }

.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 56px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px 20px; display: grid; gap: 18px; min-width: 0; }
.card h1 { margin: 0; font-size: 22px; text-wrap: balance; }
.card h2 { margin: 0; font-size: 17px; }
.card p { margin: 0; }
.card ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.muted { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 13px; color: var(--muted); }
.pos { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.badge { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--ok); }

.stem { background: var(--stem); border-radius: 6px; padding: 14px 16px; display: grid; gap: 8px; font-size: 14.5px; }
.stem p { margin: 0; }
.card > h3 { margin: 0 0 -10px; font-size: 15px; }
.stem h3 { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.stem ul { margin: 0; padding-left: 20px; }
.stem b { font-weight: 600; }

.cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
.cmp th, .cmp td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; text-align: left; }
.cmp th { background: var(--head); font-weight: 600; }
.cmp td.lab { width: 15%; background: var(--lab); font-weight: 600; font-size: 13.5px; }
.cmp td div { margin: 2px 0; }
.cmp details { margin: 2px 0 6px; }
.cmp summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.cmp details pre { white-space: pre-wrap; font: 12px/1.35 var(--font-mono); background: var(--bg); padding: 6px 8px; margin: 2px 0; border-radius: 4px; }
.tablewrap { overflow-x: auto; }
.cmp td.pref { width: 13rem; background: var(--lab); vertical-align: middle; }
.cmp th.prefh { width: 13rem; }
.cmp .keys { font-weight: 400; font-size: 11px; color: var(--muted); }
.sc { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.sc label { display: grid; justify-items: center; gap: 2px; cursor: pointer; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.sc input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.sc label:nth-child(1) span::before { content: "◀◀"; } .sc label:nth-child(2) span::before { content: "◀"; }
.sc label:nth-child(3) span::before { content: "="; } .sc label:nth-child(4) span::before { content: "▶"; } .sc label:nth-child(5) span::before { content: "▶▶"; }
.sc label span { font-size: 0; } .sc label span::before { font-size: 11px; }
tr.missing td.pref { outline: 2px solid var(--warn); outline-offset: -2px; }
tr.missing td.lab { color: var(--warn); }

form { display: grid; gap: 20px; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
legend { padding: 0; font-weight: 600; font-size: 15px; margin-bottom: 8px; }
.saf { display: grid; grid-template-columns: 9rem repeat(5, auto) 1fr; gap: 6px 14px; align-items: center; font-size: 14px; }
.saf label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.saf input { width: 17px; height: 17px; accent-color: var(--accent); }
.saf .who { font-weight: 600; }
.field { display: grid; gap: 6px; font-weight: 600; font-size: 14.5px; }
.field span { font-weight: 400; color: var(--muted); font-size: 13px; }
textarea, input[type="text"] { font: inherit; font-size: 14.5px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%; }
textarea { min-height: 72px; resize: vertical; }
input[type="text"] { max-width: 16rem; font-family: var(--font-mono); letter-spacing: .04em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.btn { font: inherit; font-weight: 600; font-size: 14px; padding: 9px 18px; border-radius: 6px; cursor: pointer; border: 1px solid var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn.small { font-size: 12.5px; padding: 5px 10px; }
.status { margin: 0; font-size: 13.5px; color: var(--muted); }
.status.err { color: var(--warn); }
.status.ok { color: var(--ok); }
pre.sent { margin: 0; max-height: 320px; overflow: auto; font-family: var(--font-mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
@media (max-width: 700px) {
  .card { padding: 16px 12px; }
  .cmp { font-size: 13px; min-width: 820px; }
  .saf { grid-template-columns: 1fr; }
  .track { width: 80px; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <span class="brand" id="brand">HF Plan Comparison</span>
    <a href="#" class="help" id="helpLink" hidden>Instructions</a>
    <span class="prog" id="prog" hidden><span id="progText"></span><span class="track"><span class="fill" id="progFill"></span></span></span>
    <button class="btn ghost small" id="dl" type="button" hidden title="Save a copy of your answers on this device">Download my answers</button>
  </div>
</header>
<p class="demo" id="demo" hidden>Demo mode: answers stay in this browser and are not sent anywhere.</p>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>
<noscript><p class="wrap">This study page needs JavaScript.</p></noscript>

<!-- bump ?v= whenever config.js changes, so browsers refetch it (GitHub Pages caches files for 10 min) -->
<script src="config.js?v=20261029"></script>
<script>
(() => {
  "use strict";
  const PAGE_VERSION = "2026-10-29-case";
  const CFG = Object.assign({ endpoint: "", title: "HF Plan Comparison", intro: "", contact: "" }, window.STUDY_CONFIG || {});
  const DEMO = !CFG.endpoint;
  const PREF = [["strong_1", "Strongly prefer", "Option 1"], ["slight_1", "Slightly prefer", "Option 1"], ["neutral", "Neutral", ""],
                ["slight_2", "Slightly prefer", "Option 2"], ["strong_2", "Strongly prefer", "Option 2"]];
  const $ = id => document.getElementById(id);
  const app = $("app");
  const INTRO_VER = CFG.introVersion || "1";
  $("helpLink").addEventListener("click", e => { e.preventDefault(); if (S.queue.length) intro(); });
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };
  const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  const S = { study: "", version: "", domains: [], cases: {}, assign: { evaluators: {} },
              code: "", queue: [], idx: -1, done: new Set(), answers: {}, sent: [], acc: {}, t0: 0,
              outbox: [], pending: new Set() };
  const key = k => `hfrs:${S.study}:${S.code}:${k}`;
  const caseDone = cid => S.done.has(`${cid}-${S.domains[0][0]}`) || S.pending.has(cid);

  // ---------- timing ----------
  function stopClock() {
    const e = S.queue[S.idx];
    if (e && S.t0) S.acc[e.case] = (S.acc[e.case] || 0) + (performance.now() - S.t0) / 1000;
    S.t0 = 0;
  }
  function startClock() { S.t0 = S.idx >= 0 ? performance.now() : 0; }
  document.addEventListener("visibilitychange", () => { if ($("caseForm")) document.hidden ? stopClock() : startClock(); });

  // ---------- boot ----------
  async function getJSON(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(url + " " + r.status);
    return r.json();
  }
  async function boot() {
    $("brand").textContent = CFG.title;
    $("demo").hidden = !DEMO;
    let doc;
    try {
      [doc, S.assign] = await Promise.all([getJSON("cases.json"), getJSON("assignments.json").catch(() => ({ evaluators: {} }))]);
    } catch (e) {
      return message("Couldn't load the study", "The study files didn't load. Reload the page to try again.");
    }
    S.study = doc.study || "study"; S.version = doc.version || ""; S.domains = doc.domains; S.cases = doc.cases;
    const q = new URLSearchParams(location.search).get("r");
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    const code = (q || h || store.get("hfrs:lastCode", "") || (DEMO ? "DEMO" : "")).trim();
    code ? start(code) : askCode();
  }
  function queueFor(code) {
    if (DEMO && code === "DEMO") return Object.keys(S.cases).map((cid, i) => ({ case: cid, left: i % 2 ? "B" : "A" }));
    const q = (S.assign.evaluators || {})[code];
    return q ? q.filter(e => S.cases[e.case]) : null;
  }
  async function start(code) {
    const queue = queueFor(code);
    if (!queue || !queue.length) return askCode(code ? "That code isn't part of this study. Check your link." : "");
    S.code = code; S.queue = queue;
    store.set("hfrs:lastCode", code);
    S.answers = store.get(key("answers"), {});
    S.done = new Set(store.get(key("done"), []));
    S.outbox = store.get(key("outbox"), []);
    S.pending = new Set(S.outbox.map(p => p.case_id));
    if (!DEMO) {
      await flushOutbox();
      try {
        const r = await getJSON(CFG.endpoint + (CFG.endpoint.includes("?") ? "&" : "?") + "r=" + encodeURIComponent(code));
        if (r.ok === false && r.error === "unknown_evaluator") {
          return message("Code not registered", "Your code isn't registered with the study yet, so answers can't be saved. Contact the study team.");
        }
        (r.done || []).forEach(id => S.done.add(id));
        persist();
      } catch (e) { /* offline: continue with what this browser remembers */ }
    }
    $("prog").hidden = false;
    progress();
    if (allDone()) return finish();
    $("helpLink").hidden = false;
    if (store.get(key("introSeen"), "") !== INTRO_VER) return intro();
    show(nextUndone(-1));
  }

  // ---------- screens ----------
  function message(title, text) { app.innerHTML = `<section class="card"><h1>${esc(title)}</h1><p>${esc(text)}</p></section>`; }
  function askCode(err) {
    $("prog").hidden = true;
    app.innerHTML = `<section class="card"><h1>${esc(CFG.title)}</h1><p>Enter the evaluator code from your invitation link.</p>
      <form id="codeForm" novalidate><label class="field" for="codeInput">Evaluator code
        <input type="text" id="codeInput" autocomplete="off" spellcheck="false" placeholder="R01-ABCD"></label>
        <div class="actions"><button class="btn primary" type="submit">Start</button><p class="status err" role="status">${err ? esc(err) : ""}</p></div></form></section>`;
    $("codeForm").addEventListener("submit", e => {
      e.preventDefault();
      const code = $("codeInput").value.trim().toUpperCase();
      if (!code) return;
      try { history.replaceState(null, "", "?r=" + encodeURIComponent(code)); } catch (er) { /* ignore */ }
      start(code);
    });
  }
  function intro() {
    stopClock();
    const back = S.idx >= 0 ? S.idx : nextUndone(-1);
    app.innerHTML = `<section class="card"><h1>Before you start</h1>${CFG.intro}
      <p class="muted">${S.queue.length} cases · you can stop and come back with the same link</p>
      <div class="actions"><button class="btn primary" id="go" type="button">${S.idx >= 0 ? "Back to the case" : "Start"}</button></div></section>`;
    $("go").addEventListener("click", () => { store.set(key("introSeen"), INTRO_VER); allDone() && S.idx < 0 ? finish() : show(back); });
    window.scrollTo(0, 0);
  }
  function finish() {
    stopClock(); S.idx = -1;
    const contact = CFG.contact ? `<p class="muted">${esc(CFG.contact)}</p>` : "";
    const demo = DEMO && S.sent.length ? `<p class="muted">Demo mode. These payloads would be sent to the Google Sheet:</p><pre class="sent">${esc(S.sent.map(r => JSON.stringify(r)).join("\n"))}</pre>` : "";
    const pend = S.pending.size ? `<p class="status err">${S.pending.size} case(s) are saved on this device but not yet uploaded, because this network could not reach the server. Open your link once on another network (home Wi-Fi or a phone hotspot) and they will upload by themselves, or use "Download my answers" and email the file to the study team.</p>` : "";
    app.innerHTML = `<section class="card"><h1>All ${S.queue.length} cases are ${S.pending.size ? "answered" : "submitted"}</h1><p>Thank you.${S.pending.size ? "" : " You can close this page."}</p>${pend}${contact}${demo}
      <div class="actions"><button class="btn ghost" id="review" type="button">Review your answers</button></div></section>`;
    $("review").addEventListener("click", () => show(0));
    window.scrollTo(0, 0);
  }

  // ---------- case ----------
  function stemBlock(s) {
    const meds = String(s.home_meds || "");
    const fromOrders = /^From first-12 h orders:\s*/i.test(meds);
    const medsLabel = fromOrders ? "Medication orders in the first 12 h" : "Patient home medications";
    const list = (title, arr) => arr && arr.length ? `<h3>${esc(title)}</h3><ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
    return `<div class="stem">
      <p>${esc(s.presentation)}</p>
      <p><b>${medsLabel}:</b> ${esc(meds.replace(/^From first-12 h orders:\s*/i, ""))}</p>
      <p><b>Vitals:</b> ${esc(s.vitals)}</p>
      <p><b>Labs:</b> ${esc(s.labs)}</p>
      ${list("Physical exam", s.exam)}${list("Echo", s.echo)}${list("ECG", s.ecg)}${list("Imaging", s.imaging)}${list("Cardiac catheterization / procedure", s.cath)}
    </div>`;
  }
  function cell(entries) {
    if (!entries || !entries.length) return "<div class=\"muted\">—</div>";
    return entries.map(x => `<div>• ${esc(x.text)}</div>` + (x.detail ? `<details><summary>details</summary><pre>${esc(x.detail)}</pre></details>` : "")).join("");
  }
  function scale(k, label, prevChoice) {
    return `<div class="sc" role="radiogroup" aria-label="Preference: ${esc(label)}">` + PREF.map(([v, a, b]) =>
      `<label title="${a}${b ? " " + b : ""}"><input type="radio" name="pref-${k}" value="${v}"${prevChoice === v ? " checked" : ""}><span>${b ? b.replace("Option ", "") : "="}</span></label>`).join("") + `</div>`;
  }
  function table(c, left, prev) {
    const [o1, o2] = left === "A" ? [c.A, c.B] : [c.B, c.A];
    const rows = S.domains.map(([k, label]) => `<tr data-dom="${k}"><td class="lab">${esc(label)}</td><td>${cell(o1[k])}</td><td>${cell(o2[k])}</td><td class="pref">${scale(k, label, prev.answers && prev.answers[k])}</td></tr>`).join("");
    return `<div class="tablewrap"><table class="cmp" aria-label="Plan comparison">
      <tr><th style="width:13%">Domain</th><th>Option 1</th><th>Option 2</th><th class="prefh">Your preference<br><span class="keys">◀◀ strongly 1 · ◀ slightly 1 · = neutral · ▶ slightly 2 · ▶▶ strongly 2</span></th></tr>${rows}</table></div>`;
  }
  function show(i) {
    stopClock(); S.idx = i;
    const e = S.queue[i], c = S.cases[e.case];
    const prev = S.answers[e.case] || { answers: {} };
    const done = caseDone(e.case);
    const saf = who => [0, 1, 2, 3, 4].map(n => `<label><input type="radio" name="saf-${who}" value="${n}"${prev["safety_" + who] === n ? " checked" : ""}>${n}</label>`).join("");
    const comp = who => [0, 1, 2, 3, 4].map(n => `<label><input type="radio" name="comp-${who}" value="${n}"${prev["completeness_" + who] === n ? " checked" : ""}>${n}</label>`).join("");
    app.innerHTML = `
      <section class="card">
        <div class="meta"><span class="pos">Case ${i + 1} of ${S.queue.length}</span><span>${esc(c.cohort.replace(/_/g, " "))}</span>${done ? '<span class="badge">Submitted</span>' : ""}</div>
        ${stemBlock(c.stem)}
        <h2>Two management plans for this patient — select your preference for Option 1 or Option 2 in each category (right-hand column)</h2>
        <form id="caseForm" novalidate>
          ${table(c, e.left, prev)}
          <fieldset><legend>Were there any safety concerns in each option's recommendations? 0 = no safety concern, 4 = very dangerous safety concern</legend>
            <div class="saf"><span class="who">Option 1</span>${saf(1)}<span></span><span class="who">Option 2</span>${saf(2)}<span></span></div>
          </fieldset>
          <fieldset><legend>How complete is each option's plan for this patient? 0 = major gaps, 4 = nothing important missing</legend>
            <div class="saf"><span class="who">Option 1</span>${comp(1)}<span></span><span class="who">Option 2</span>${comp(2)}<span></span></div>
          </fieldset>
          <label class="field" for="comment">Comments <span>Optional. Explain any safety concern, unsupported fact, or missed opportunity.</span>
            <textarea id="comment" name="comment">${esc(prev.comment || "")}</textarea></label>
          <div class="actions">
            ${i > 0 ? '<button class="btn ghost" id="prevBtn" type="button">Previous</button>' : ""}
            <button class="btn primary" id="submitBtn" type="submit">${done ? "Update answers" : "Submit this case"}</button>
            ${i < S.queue.length - 1 ? `<button class="btn ghost" id="nextBtn" type="button">${done ? "Next" : "Skip for now"}</button>` : ""}
            <p class="status" id="status" role="status"></p>
          </div>
        </form>
      </section>`;
    $("caseForm").addEventListener("submit", submit);
    if ($("prevBtn")) $("prevBtn").addEventListener("click", () => show(i - 1));
    if ($("nextBtn")) $("nextBtn").addEventListener("click", () => show(i + 1));
    progress(); window.scrollTo(0, 0); startClock();
  }

  async function submit(ev) {
    ev.preventDefault();
    const e = S.queue[S.idx], c = S.cases[e.case];
    const status = $("status"), btn = $("submitBtn");
    const answers = {}, missing = [];
    S.domains.forEach(([k, label]) => {
      const p = document.querySelector(`input[name="pref-${k}"]:checked`);
      const tr = document.querySelector(`tr[data-dom="${k}"]`);
      if (p) { answers[k] = p.value; tr.classList.remove("missing"); } else { missing.push(label); tr.classList.add("missing"); }
    });
    const s1 = document.querySelector('input[name="saf-1"]:checked'), s2 = document.querySelector('input[name="saf-2"]:checked');
    const c1 = document.querySelector('input[name="comp-1"]:checked'), c2 = document.querySelector('input[name="comp-2"]:checked');
    if (missing.length || !s1 || !s2 || !c1 || !c2) {
      status.className = "status err";
      status.textContent = missing.length ? `Choose a preference for every category (${missing.length} left).`
        : (!s1 || !s2) ? "Rate the safety concern for both options." : "Rate the completeness of both options.";
      return;
    }
    stopClock();
    const payload = {
      study: S.study, items_version: S.version, evaluator: S.code, case_id: e.case, position: S.idx + 1, left_system: e.left,
      answers, safety_1: Number(s1.value), safety_2: Number(s2.value),
      completeness_1: Number(c1.value), completeness_2: Number(c2.value), comment: $("comment").value.trim(),
      seconds: Math.round(S.acc[e.case] || 0), submitted_at: new Date().toISOString(), page_version: PAGE_VERSION, user_agent: navigator.userAgent
    };
    btn.disabled = true; status.className = "status"; status.textContent = "Saving…";
    let err = "";
    if (DEMO) S.sent.push(payload);
    else err = await send(payload);
    if (err && err !== "network") {
      btn.disabled = false; startClock(); status.className = "status err";
      status.textContent = err === "unknown_evaluator" ? "Your code isn't registered with the study, so this answer wasn't saved. Contact the study team."
        : `Couldn't save (${err}). Press Submit again.`;
      return;
    }
    S.acc[e.case] = 0;
    S.answers[e.case] = { answers, safety_1: payload.safety_1, safety_2: payload.safety_2,
                          completeness_1: payload.completeness_1, completeness_2: payload.completeness_2, comment: payload.comment };
    if (err === "network") {
      // No route to the server (e.g. a network that blocks Google). Keep the answer on this device and retry later.
      S.outbox = S.outbox.filter(p => p.case_id !== e.case).concat([payload]);
      S.pending.add(e.case);
      persist(); progress();
      status.className = "status err";
      status.textContent = "No connection to the server (hospital Wi-Fi often blocks Google). Your answers for this case are saved on this device and will be sent automatically when you open your link on another network.";
      setTimeout(() => { if (S.queue[S.idx] !== e) return; allDone() ? finish() : show(nextUndone(S.idx)); }, 2500);
      return;
    }
    S.domains.forEach(([k]) => S.done.add(`${e.case}-${k}`));
    S.pending.delete(e.case);
    persist(); progress();
    if (S.outbox.length) flushOutbox();
    status.className = "status ok"; status.textContent = "Saved";
    setTimeout(() => { if (S.queue[S.idx] !== e) return; allDone() ? finish() : show(nextUndone(S.idx)); }, 450);
  }

  // ---------- helpers ----------
  function nextUndone(from) {
    const n = S.queue.length;
    for (let k = 1; k <= n; k++) { const j = (from + k + n) % n; if (!caseDone(S.queue[j].case)) return j; }
    return 0;
  }
  function allDone() { return S.queue.every(e => caseDone(e.case)); }
  function persist() { store.set(key("done"), [...S.done]); store.set(key("answers"), S.answers); store.set(key("outbox"), S.outbox); }
  function progress() {
    const n = S.queue.length, d = S.queue.filter(e => caseDone(e.case)).length, p = S.pending.size;
    $("progText").textContent = `${d} of ${n} cases submitted` + (p ? ` (${p} waiting to upload)` : "");
    $("progFill").style.width = n ? (100 * d / n) + "%" : "0";
    $("dl").hidden = !(S.code && (Object.keys(S.answers).length || S.outbox.length));
  }
  // One submission to the Apps Script. "" = saved; "network" = no route (kept on the device); else the server's error.
  async function send(payload) {
    try {
      const r = await fetch(CFG.endpoint, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
      const res = await r.json();
      return res.ok ? "" : (res.error || "unknown");
    } catch (x) { return "network"; }
  }
  // Send queued answers; stop at the first failure (the network is still blocked).
  async function flushOutbox() {
    if (DEMO || !S.outbox.length) return;
    for (const payload of S.outbox) {
      const err = await send(Object.assign({}, payload, { uploaded_later: true }));
      if (err) break;                                   // still no route: keep the rest for next time
      S.domains.forEach(([k]) => S.done.add(`${payload.case_id}-${k}`));
      S.pending.delete(payload.case_id);
    }
    S.outbox = S.outbox.filter(p => S.pending.has(p.case_id));
    persist(); if ($("progText")) progress();
  }
  // Last resort on a blocked network: a file the evaluator can email to the study team.
  function downloadAnswers() {
    const data = { study: S.study, items_version: S.version, evaluator: S.code, exported_at: new Date().toISOString(), page_version: PAGE_VERSION,
                   queue: S.queue, answers: S.answers, pending_upload: S.outbox };
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `hf_reader_study_${S.code}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $("dl").addEventListener("click", downloadAnswers);
  boot();
})();
</script>
</body>
</html>
