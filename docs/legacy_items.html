<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HF Reader Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky progress bar, then one narrow column with one item card at a time */
:root {
  --bg: #f4f6f7;
  --surface: #ffffff;
  --fg: #1a2127;
  --muted: #5a6670;
  --line: #d9dfe3;
  --accent: #1d5a85;
  --accent-soft: #e3edf5;
  --on-accent: #ffffff;
  --warn: #9a3b2a;
  --ok: #2f6b45;
  --hl-key: #fbf0c4;
  --hl-diff: #e9e2f8;
  --font-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111518; --surface: #191e22; --fg: #e3e8eb; --muted: #95a1aa; --line: #2a3238;
    --accent: #79afdb; --accent-soft: #1c2934; --on-accent: #0f1a22; --warn: #e08a76; --ok: #7cc496;
    --hl-key: #4a4120; --hl-diff: #3a3152;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111518; --surface: #191e22; --fg: #e3e8eb; --muted: #95a1aa; --line: #2a3238;
  --accent: #79afdb; --accent-soft: #1c2934; --on-accent: #0f1a22; --warn: #e08a76; --ok: #7cc496;
  --hl-key: #4a4120; --hl-diff: #3a3152;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
[hidden] { display: none !important; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 800px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; }
.brand { font-weight: 700; font-size: 14.5px; }
.prog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { width: 120px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fill { display: block; height: 100%; width: 0; background: var(--accent); }
.demo { max-width: 800px; margin: 12px auto 0; padding-inline: 16px; font-size: 13px; color: var(--warn); }

.wrap { max-width: 800px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px 20px; display: grid; gap: 18px; min-width: 0; }
.card h1 { margin: 0; font-size: 22px; text-wrap: balance; }
.card p { margin: 0; max-width: 66ch; }
.card ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 66ch; }
.muted { color: var(--muted); }

.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 13px; color: var(--muted); }
.pos { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.badge { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--ok); }

mark { color: inherit; border-radius: 3px; padding: 0 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
mark.k { background: var(--hl-key); }
mark.d { background: var(--hl-diff); }

.case { display: grid; gap: 8px; }
.lead { margin: 0; font-weight: 600; font-size: 15.5px; }
.facts { margin: 0; display: grid; grid-template-columns: 5.5rem 1fr; gap: 5px 12px; font-size: 14.5px; }
.facts dt { font-size: 12.5px; font-weight: 600; color: var(--muted); padding-top: 1px; }
.facts dd { margin: 0; min-width: 0; }
.q { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; }

.cmpwrap { display: grid; gap: 6px; min-width: 0; }
.cmp { display: grid; grid-template-columns: minmax(6.5rem, 8.5rem) 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-size: 14.5px; }
.cmp > div { padding: 8px 12px; border-top: 1px solid var(--line); min-width: 0; }
.cmp .c1, .cmp .c2, .cmp .both { border-left: 1px solid var(--line); }
.cmp .both { grid-column: span 2; }
.cmp .hd { border-top: 0; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--bg); }
.cmp .lab { font-size: 13px; font-weight: 600; color: var(--muted); }
.cmp .none { color: var(--muted); }
.pill { display: inline-block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.legend { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend .pill { margin-left: 0; margin-right: 4px; }

form { display: grid; gap: 18px; }
.item form { border-top: 1px solid var(--line); padding-top: 18px; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
legend { padding: 0; font-weight: 600; font-size: 14.5px; margin-bottom: 8px; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.scale input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.scale label { display: grid; place-items: center; text-align: center; padding: 9px 4px; min-height: 52px; cursor: pointer; font-size: 13px; line-height: 1.25; border-left: 1px solid var(--line); background: var(--surface); }
.scale label:first-of-type { border-left: 0; }
.scale label span { display: block; color: var(--muted); font-size: 12px; }
.scale label:hover { background: var(--accent-soft); }
.scale input:checked + label { background: var(--accent); color: var(--on-accent); }
.scale input:checked + label span { color: var(--on-accent); }
.scale input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -3px; }

.field { display: grid; gap: 6px; font-weight: 600; font-size: 14.5px; }
.field span { font-weight: 400; color: var(--muted); font-size: 13px; }
textarea, input[type="text"] { font: inherit; font-size: 14.5px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%; }
textarea { min-height: 64px; resize: vertical; }
input[type="text"] { max-width: 16rem; font-family: var(--font-mono); letter-spacing: .04em; }

.actions { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.btn { font: inherit; font-weight: 600; font-size: 14px; padding: 9px 18px; border-radius: 6px; cursor: pointer; border: 1px solid var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn:focus-visible, textarea:focus-visible, input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { margin: 0; font-size: 13.5px; color: var(--muted); }
.status.err { color: var(--warn); }
.status.ok { color: var(--ok); }
.hint { font-size: 12.5px; color: var(--muted); }
pre.sent { margin: 0; max-height: 320px; overflow: auto; font-family: var(--font-mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }

@media (max-width: 600px) {
  .card { padding: 18px 14px; }
  .facts { grid-template-columns: 4.6rem 1fr; }
  .cmp { grid-template-columns: 1fr 1fr; font-size: 14px; }
  .cmp .hd.lab { display: none; }
  .cmp .lab { grid-column: 1 / -1; padding-bottom: 2px; }
  .cmp .c1, .cmp .c2, .cmp .both { border-top: 0; padding-top: 2px; }
  .cmp .hd.c1, .cmp .hd.c2 { padding-top: 8px; }
  .cmp .c1, .cmp .both { border-left: 0; }
  .cmp .both { grid-column: 1 / -1; }
  .track { width: 80px; }
  .hint.keys { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .scale label { transition: background-color .12s ease; }
  .fill { transition: width .25s ease; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <span class="brand" id="brand">HF Plan Comparison</span>
    <span class="prog" id="prog" hidden><span id="progText"></span><span class="track"><span class="fill" id="progFill"></span></span></span>
  </div>
</header>
<p class="demo" id="demo" hidden>Demo mode: answers stay in this browser and are not sent anywhere.</p>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>
<noscript><p class="wrap">This study page needs JavaScript.</p></noscript>

<script src="config.js"></script>
<script>
(() => {
  "use strict";
  const PAGE_VERSION = "2026-10-19";
  const CFG = Object.assign({ endpoint: "", title: "HF Plan Comparison", intro: "", contact: "" }, window.STUDY_CONFIG || {});
  const DEMO = !CFG.endpoint;
  const PREF = [
    ["strong_1", "Strongly", "Option 1"],
    ["slight_1", "Slightly", "Option 1"],
    ["neutral", "Neutral", ""],
    ["slight_2", "Slightly", "Option 2"],
    ["strong_2", "Strongly", "Option 2"]
  ];
  const $ = id => document.getElementById(id);
  const app = $("app");

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const fmt = s => esc(s)
    .replace(/\{\{(.+?)\}\}/g, '<mark class="k">$1</mark>')
    .replace(/\[\[(.+?)\]\]/g, '<mark class="d">$1</mark>');

  const S = {
    study: "", version: "", items: {}, assign: { evaluators: {} },
    code: "", queue: [], idx: -1, done: new Set(), answers: {}, sent: [],
    acc: {}, t0: 0
  };
  const key = k => `hfrs:${S.study}:${S.code}:${k}`;

  // ---------- timing (seconds the item was visible) ----------
  function stopClock() {
    const e = S.queue[S.idx];
    if (e && S.t0) S.acc[e.item] = (S.acc[e.item] || 0) + (performance.now() - S.t0) / 1000;
    S.t0 = 0;
  }
  function startClock() { S.t0 = S.idx >= 0 ? performance.now() : 0; }
  document.addEventListener("visibilitychange", () => {
    if (!$("itemForm")) return;
    document.hidden ? stopClock() : startClock();
  });

  // ---------- boot ----------
  async function getJSON(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(url + " " + r.status);
    return r.json();
  }

  async function boot() {
    $("brand").textContent = CFG.title;
    $("demo").hidden = !DEMO;
    let itemsDoc;
    try {
      [itemsDoc, S.assign] = await Promise.all([
        getJSON("items.json"),
        getJSON("assignments.json").catch(() => ({ evaluators: {} }))
      ]);
    } catch (e) {
      return message("Couldn't load the study", "The study files didn't load. Reload the page to try again.");
    }
    S.study = itemsDoc.study || "study";
    S.version = itemsDoc.version || "";
    itemsDoc.items.forEach(it => { S.items[it.id] = it; });

    const q = new URLSearchParams(location.search).get("r");
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    const code = (q || h || store.get("hfrs:lastCode", "") || (DEMO ? "DEMO" : "")).trim();
    code ? start(code) : askCode();
  }

  function queueFor(code) {
    if (DEMO && code === "DEMO") {
      return Object.keys(S.items).map((id, i) => ({ item: id, left: i % 2 ? "B" : "A" }));
    }
    const q = (S.assign.evaluators || {})[code];
    return q ? q.filter(e => S.items[e.item]) : null;
  }

  async function start(code) {
    const queue = queueFor(code);
    if (!queue || !queue.length) return askCode(code ? "That code isn't part of this study. Check your link." : "");
    S.code = code;
    S.queue = queue;
    store.set("hfrs:lastCode", code);
    S.answers = store.get(key("answers"), {});
    S.done = new Set(store.get(key("done"), []));

    if (!DEMO) {
      try {
        const r = await getJSON(CFG.endpoint + (CFG.endpoint.includes("?") ? "&" : "?") + "r=" + encodeURIComponent(code));
        if (r.ok === false && r.error === "unknown_evaluator") {
          return message("Code not registered", "Your code isn't registered with the study yet, so answers can't be saved. Contact the study team.");
        }
        (r.done || []).forEach(id => S.done.add(id));
        persist();
      } catch (e) { /* offline or blocked: continue with what this browser remembers */ }
    }
    $("prog").hidden = false;
    progress();
    if (allDone()) return finish();
    if (!S.done.size && !store.get(key("introSeen"), false)) return intro();
    show(nextUndone(-1));
  }

  // ---------- screens ----------
  function message(title, text) {
    app.innerHTML = `<section class="card"><h1>${esc(title)}</h1><p>${esc(text)}</p></section>`;
  }

  function askCode(err) {
    $("prog").hidden = true;
    app.innerHTML = `
      <section class="card">
        <h1>${esc(CFG.title)}</h1>
        <p>Enter the evaluator code from your invitation link.</p>
        <form id="codeForm" novalidate>
          <label class="field" for="codeInput">Evaluator code
            <input type="text" id="codeInput" autocomplete="off" spellcheck="false" placeholder="R01-ABCD">
          </label>
          <div class="actions"><button class="btn primary" type="submit">Start</button>
          <p class="status err" role="status">${err ? esc(err) : ""}</p></div>
        </form>
      </section>`;
    $("codeForm").addEventListener("submit", e => {
      e.preventDefault();
      const code = $("codeInput").value.trim().toUpperCase();
      if (!code) return;
      try { history.replaceState(null, "", "?r=" + encodeURIComponent(code)); } catch (er) { /* not allowed here */ }
      start(code);
    });
  }

  function intro() {
    app.innerHTML = `
      <section class="card">
        <h1>Before you start</h1>
        ${CFG.intro}
        <p class="muted">${S.queue.length} items · about ${S.queue.length} minutes</p>
        <div class="actions"><button class="btn primary" id="go" type="button">Start</button></div>
      </section>`;
    $("go").addEventListener("click", () => { store.set(key("introSeen"), true); show(nextUndone(-1)); });
  }

  function finish() {
    stopClock();
    S.idx = -1;
    const contact = CFG.contact ? `<p class="muted">${esc(CFG.contact)}</p>` : "";
    const demo = DEMO && S.sent.length
      ? `<p class="muted">Demo mode. These rows would be sent to the Google Sheet:</p><pre class="sent">${esc(S.sent.map(r => JSON.stringify(r)).join("\n"))}</pre>`
      : "";
    app.innerHTML = `
      <section class="card">
        <h1>All ${S.queue.length} items are submitted</h1>
        <p>Thank you. You can close this page.</p>
        ${contact}${demo}
        <div class="actions"><button class="btn ghost" id="review" type="button">Review your answers</button></div>
      </section>`;
    $("review").addEventListener("click", () => show(0));
    window.scrollTo(0, 0);
  }

  // ---------- item ----------
  function caseBlock(it) {
    const dl = it.facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${fmt(v)}</dd>`).join("");
    return `<div class="case"><p class="lead">${fmt(it.lead)}</p><dl class="facts">${dl}</dl></div>`;
  }

  function grid(it, left) {
    const cell = (v, cls) => v === null || v === undefined
      ? `<div class="${cls} none">—</div>`
      : `<div class="${cls}">${fmt(v)}</div>`;
    const rows = it.rows.map(([slot, a, b]) => {
      const lab = `<div class="lab">${esc(slot)}</div>`;
      if (b === "=") return `${lab}<div class="both">${fmt(a)}<span class="pill">both</span></div>`;
      const [o1, o2] = left === "A" ? [a, b] : [b, a];
      return lab + cell(o1, "c1") + cell(o2, "c2");
    }).join("");
    return `<div class="cmpwrap">
      <div class="cmp" role="table" aria-label="Plan comparison">
        <div class="hd lab"></div><div class="hd c1">Option 1</div><div class="hd c2">Option 2</div>${rows}
      </div>
      <p class="legend"><span><mark class="d">Highlighted</mark> differs between options</span><span><span class="pill">both</span>same in both</span><span>— not addressed</span></p>
    </div>`;
  }

  function show(i) {
    stopClock();
    S.idx = i;
    const e = S.queue[i];
    const it = S.items[e.item];
    const prev = S.answers[e.item] || {};
    const done = S.done.has(e.item);
    const scale = PREF.map(([v, a, b], n) => {
      const id = `pref-${v}`;
      return `<input type="radio" id="${id}" name="pref" value="${v}"${prev.choice === v ? " checked" : ""}>` +
        `<label for="${id}" aria-label="${b ? `${a} prefer ${b}` : a}" title="Key ${n + 1}">${a}${b ? `<span>${b}</span>` : ""}</label>`;
    }).join("");

    app.innerHTML = `
      <section class="card item" aria-labelledby="qText">
        <div class="meta"><span class="pos">Item ${i + 1} of ${S.queue.length}</span><span>${esc(it.domain_label || it.domain)}</span>${done ? '<span class="badge">Submitted</span>' : ""}</div>
        ${caseBlock(it)}
        <h2 class="q" id="qText">${esc(it.q)}</h2>
        ${grid(it, e.left)}
        <form id="itemForm" novalidate>
          <fieldset>
            <legend>Preference for this domain</legend>
            <div class="scale">${scale}</div>
            <span class="hint keys">Keys 1–5 also select a preference.</span>
          </fieldset>
          <label class="field" for="comment">Comments <span>Optional. Safety concern, unsupported fact, or missed opportunity.</span>
            <textarea id="comment" name="comment">${esc(prev.comment || "")}</textarea>
          </label>
          <div class="actions">
            ${i > 0 ? '<button class="btn ghost" id="prevBtn" type="button">Previous</button>' : ""}
            <button class="btn primary" id="submitBtn" type="submit">${done ? "Update answer" : "Submit"}</button>
            ${i < S.queue.length - 1 ? `<button class="btn ghost" id="nextBtn" type="button">${done ? "Next" : "Skip for now"}</button>` : ""}
            <p class="status" id="status" role="status"></p>
          </div>
        </form>
      </section>`;

    $("itemForm").addEventListener("submit", submit);
    if ($("prevBtn")) $("prevBtn").addEventListener("click", () => show(i - 1));
    if ($("nextBtn")) $("nextBtn").addEventListener("click", () => show(i + 1));
    progress();
    window.scrollTo(0, 0);
    startClock();
  }

  async function submit(ev) {
    ev.preventDefault();
    const e = S.queue[S.idx];
    const it = S.items[e.item];
    const status = $("status");
    const btn = $("submitBtn");
    const picked = document.querySelector('input[name="pref"]:checked');
    if (!picked) {
      status.className = "status err";
      status.textContent = "Choose a preference to submit.";
      return;
    }
    stopClock();
    const payload = {
      study: S.study,
      items_version: S.version,
      evaluator: S.code,
      item_id: e.item,
      case_id: it.case,
      domain: it.domain,
      position: S.idx + 1,
      left_system: e.left,
      choice: picked.value,
      comment: $("comment").value.trim(),
      seconds: Math.round(S.acc[e.item] || 0),
      submitted_at: new Date().toISOString(),
      page_version: PAGE_VERSION,
      user_agent: navigator.userAgent
    };
    btn.disabled = true;
    status.className = "status";
    status.textContent = "Saving…";

    let err = "";
    if (DEMO) {
      S.sent.push(payload);
    } else {
      try {
        const r = await fetch(CFG.endpoint, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },  // simple request: no CORS preflight
          body: JSON.stringify(payload)
        });
        const res = await r.json();
        if (!res.ok) err = res.error || "unknown";
      } catch (x) {
        err = "network";
      }
    }
    if (err) {
      btn.disabled = false;
      startClock();
      status.className = "status err";
      status.textContent = err === "network"
        ? "Couldn't reach the server. Check your connection and press Submit again."
        : err === "unknown_evaluator"
          ? "Your code isn't registered with the study, so this answer wasn't saved. Contact the study team."
          : `Couldn't save (${err}). Press Submit again.`;
      return;
    }

    S.acc[e.item] = 0;
    S.done.add(e.item);
    S.answers[e.item] = { choice: payload.choice, comment: payload.comment };
    persist();
    progress();
    status.className = "status ok";
    status.textContent = "Saved";
    setTimeout(() => {
      if (S.queue[S.idx] !== e) return;          // reader already moved on
      allDone() ? finish() : show(nextUndone(S.idx));
    }, 450);
  }

  // ---------- helpers ----------
  function nextUndone(from) {
    const n = S.queue.length;
    for (let k = 1; k <= n; k++) {
      const j = (from + k + n) % n;
      if (!S.done.has(S.queue[j].item)) return j;
    }
    return 0;
  }
  function allDone() { return S.queue.every(e => S.done.has(e.item)); }
  function persist() {
    store.set(key("done"), [...S.done]);
    store.set(key("answers"), S.answers);
  }
  function progress() {
    const n = S.queue.length;
    const d = S.queue.filter(e => S.done.has(e.item)).length;
    $("progText").textContent = `${d} of ${n} submitted`;
    $("progFill").style.width = n ? (100 * d / n) + "%" : "0";
  }

  document.addEventListener("keydown", ev => {
    if (!$("itemForm") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (/^(TEXTAREA|INPUT)$/.test(ev.target.tagName) && ev.target.type !== "radio") return;
    const n = Number(ev.key);
    if (n >= 1 && n <= 5) {
      const r = document.getElementById("pref-" + PREF[n - 1][0]);
      r.checked = true;
      r.focus();
    }
  });

  boot();
})();
</script>
</body>
</html>
